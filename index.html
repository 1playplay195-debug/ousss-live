<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نتائج المباريات المباشرة - كرة القدم العربية والعالمية">
  <title>⚽ النتائج المباشرة | Live Scores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الترويسة -->
  <header>
    <h1>⚽ النتائج المباشرة</h1>
    <p class="tagline">مباريات اليوم لحظة بلحظة</p>
  </header>

  <!-- تبويبات الفلترة -->
  <nav id="nav"></nav>

  <!-- شريط التنقل بين الأيام -->
  <div class="date-bar">
    <button id="prevDay">◀ اليوم السابق</button>
    <input type="date" id="datePicker">
    <button id="nextDay">اليوم التالي ▶</button>
  </div>
  <button id="todayBtn" class="today-btn">📅 اليوم</button>

  <!-- حاوية النتائج -->
  <main id="matchesContainer">
    <p class="status-bar">⏳ جاري تحميل النتائج...</p>
  </main>

  <!-- التذييل -->
  <footer>
    <p id="lastUpdate"></p>
    <p>المصدر: ESPN API &copy; 2026</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
